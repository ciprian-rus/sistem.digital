packages:
  - apps/*
  - packages/*
  - starters/*

catalog:
  '@axe-core/playwright': 4.12.1
  '@changesets/cli': 2.31.0
  '@eslint/js': 10.0.1
  '@mdx-js/loader': 3.1.1
  '@mdx-js/react': 3.1.1
  '@next/mdx': 16.2.11
  '@playwright/test': 1.61.1
  '@types/mdx': 2.0.14
  '@types/node': 24.13.3
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.4
  eslint: 10.7.0
  eslint-config-next: 16.2.11
  globals: 17.7.0
  next: 16.2.11
  prettier: 3.9.6
  react: 19.2.7
  react-dom: 19.2.8
  remark-frontmatter: 5.0.0
  remark-mdx-frontmatter: 5.2.0
  turbo: 2.10.5
  typescript: 5.9.3
  typescript-eslint: 8.65.0
  vitest: 4.1.10

overrides:
  # Next.js still resolves an older PostCSS release; 8.5.18 patches GHSA-r28c-9q8g-f849
  # (source map path traversal) in addition to GHSA-6g55-p6wh-862q.
  postcss: 8.5.18
  # eslint's minimatch chain resolves a vulnerable brace-expansion. 5.0.8 patched
  # GHSA-mh99-v99m-4gvg (unbounded expansion DoS), but GHSA-rgw5-rvv9-x895 later
  # found a bypass of that mitigation; 5.0.9 is the actual patched floor.
  brace-expansion: 5.0.9
  # Next.js resolves sharp 0.34.x; 0.35.3 contains the reviewed libvips security fixes.
  sharp: 0.35.3
  # GHSA-5p4m-2wfm-xmqj (js-yaml quadratic CPU consumption in !!omap resolution)
  # affects both js-yaml majors changesets pulls in. Scoped per consumer since the
  # 3.x and 4.x lines aren't drop-in compatible with each other.
  'read-yaml-file>js-yaml': 3.15.1
  '@changesets/parse>js-yaml': 4.3.1
  # GHSA-2v37-7h3g-55p8 (nanoid: custom generators loop indefinitely at size 0).
  # 3.3.17 patched the original report, but a later revision lowered the floor
  # to 3.3.18 - pulled in transitively via postcss.
  'postcss>nanoid': 3.3.18

# pnpm 11 blocks dependency build scripts unless they are explicitly reviewed.
# sharp is required by Next.js for production image processing.
allowBuilds:
  sharp: true
