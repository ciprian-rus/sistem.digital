name: Temporary snapshot update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/project-analysis-evaluation-x9g6rm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @sistem-digital/website exec playwright install --with-deps chromium

      - name: Build website and workspace dependencies
        run: pnpm --filter @sistem-digital/website... build

      - name: Regenerate visual snapshots
        run: pnpm --filter @sistem-digital/website test:visual:update || true

      - name: Commit regenerated snapshots when changed
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website/tests/visual/__snapshots__

          if git diff --cached --quiet; then
            echo "Snapshots already match this environment."
            exit 0
          fi

          git commit -m "chore: regenerate visual snapshots via CI Chromium"
          git push origin HEAD:claude/project-analysis-evaluation-x9g6rm
